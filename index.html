<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Work Hours"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Work Hours</title><style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17181b;--muted:#777b84;--line:#e7e7eb;--accent:#111318;--soft:#f0f1f4;--green:#2d8a58;--red:#c74343}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{border:0}#app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:94px}.top{padding:22px 18px 8px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:13px;color:var(--muted);font-weight:600}.title{font-size:30px;font-weight:800;letter-spacing:-1px;margin:2px 0}.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:0 2px 14px #0000000b;font-size:22px}.screen{display:none;padding:0 16px}.screen.active{display:block}.sub{color:var(--muted);font-size:14px;margin:0 2px 16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid #eeeef1;border-radius:22px;padding:17px;box-shadow:0 5px 22px #00000008}.statlabel{font-size:12px;color:var(--muted);font-weight:650}.statvalue{font-size:27px;font-weight:800;margin-top:7px;letter-spacing:-.6px}.stats .card:first-child .statvalue{font-size:25px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}.sectionhead h2{font-size:17px;margin:0}.link{font-size:13px;color:var(--muted);font-weight:700;background:none}.jobs{display:grid;gap:10px}.job{display:flex;align-items:center;gap:13px}.jobdot{width:12px;height:12px;border-radius:50%;background:#17181b}.job:nth-child(2) .jobdot{background:#777}.jobname{font-weight:750}.jobmeta{font-size:12px;color:var(--muted);margin-top:3px}.jobmoney{margin-left:auto;text-align:right;font-weight:750}.recent{display:grid;gap:9px}.shift{display:flex;align-items:center;gap:12px}.datebox{width:47px;height:47px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center}.datebox b{font-size:17px}.datebox span{font-size:10px;color:var(--muted);font-weight:700}.shiftmain{min-width:0}.shiftname{font-weight:720}.shiftmeta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shiftmoney{margin-left:auto;text-align:right}.shiftmoney b{font-size:14px}.shiftmoney span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border-radius:19px;background:#111318;color:#fff;font-size:28px;box-shadow:0 10px 25px #0003;z-index:8}.nav{position:fixed;bottom:0;left:0;right:0;height:72px;padding:8px 10px max(8px,env(safe-area-inset-bottom));background:#ffffffeb;backdrop-filter:blur(18px);border-top:1px solid #dddde2;display:flex;justify-content:center;z-index:7}.navinner{width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{background:transparent;color:#8a8d95;border-radius:14px;font-size:11px;font-weight:700}.nav button.active{background:#f0f1f4;color:#111318}.nav .ico{display:block;font-size:20px;line-height:24px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.monthbar h2{margin:0;font-size:20px}.arrows{display:flex;gap:7px}.arrow{width:38px;height:38px;border-radius:12px;background:#fff}.calendar{background:#fff;border:1px solid #eeeef1;border-radius:22px;padding:14px;box-shadow:0 5px 22px #00000008}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;color:#9a9da5;font-size:11px;font-weight:700;padding:4px}.day{min-height:48px;border-radius:13px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;position:relative}.day.muted{color:#b9bbc1}.day.today{outline:1.5px solid #111318}.day.selected{background:#111318;color:#fff}.dot{width:5px;height:5px;border-radius:50%;background:#111318}.day.selected .dot{background:#fff}.detail{margin-top:12px}.detail h3{margin:0 0 10px;font-size:16px}.empty{color:var(--muted);font-size:14px;padding:8px 0}.formcard{background:#fff;border:1px solid #eeeef1;border-radius:22px;padding:18px;box-shadow:0 5px 22px #00000008}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f0f1f4;padding:4px;border-radius:15px;margin-bottom:18px}.seg button{padding:11px;border-radius:11px;background:transparent;color:#777;font-weight:750}.seg button.active{background:#fff;color:#111;box-shadow:0 2px 8px #0000000c}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 7px}.field input,.field textarea{width:100%;border:1px solid #dedfe4;background:#fafafd;border-radius:13px;padding:13px;outline:none}.field input:focus,.field textarea:focus{border-color:#999}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calc{background:#f0f1f4;border-radius:16px;padding:13px;display:flex;justify-content:space-between;align-items:center;margin:16px 0}.calc span{font-size:12px;color:var(--muted)}.calc b{font-size:17px}.primary{width:100%;padding:14px;border-radius:15px;background:#111318;color:#fff;font-weight:800}.secondary{padding:11px 14px;border-radius:13px;background:#f0f1f4;font-weight:750}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.filter{white-space:nowrap;padding:9px 13px;border-radius:12px;background:#fff;color:#777;font-weight:700;border:1px solid #eee}.filter.active{background:#111318;color:#fff;border-color:#111318}.historylist{display:grid;gap:9px;margin-top:12px}.historyitem{background:#fff;border:1px solid #eee;border-radius:18px;padding:14px}.historytop{display:flex;justify-content:space-between}.historyactions{display:flex;gap:6px;margin-top:10px}.tiny{padding:8px 11px;border-radius:10px;background:#f0f1f4;font-size:12px;font-weight:750}.tiny.delete{color:var(--red)}.modalback{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.sheet{width:min(720px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -10px 35px #0003}.sheet h3{margin:0 0 12px}.sheet button{display:block;width:100%;padding:14px;text-align:left;background:#f5f5f7;border-radius:13px;margin:7px 0;font-weight:700}.sheet .danger{color:#b33;background:#fff0f0}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#111318;color:#fff;padding:11px 15px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><div id="app"><header class="top"><div><div class="eyebrow">Your work log</div><div class="title">Work Hours</div></div><button class="iconbtn" onclick="openMore()">•••</button></header>
<section id="overview" class="screen active"><p class="sub" id="overviewMonth"></p><div class="stats"><div class="card"><div class="statlabel">This week</div><div class="statvalue" id="weekHours">0h 0m</div><div class="statlabel" id="weekPay">$0.00</div></div><div class="card"><div class="statlabel">This month</div><div class="statvalue" id="monthHours">0h 0m</div><div class="statlabel" id="monthPay">$0.00</div></div></div><div class="sectionhead"><h2>Work groups</h2></div><div class="jobs"><div class="card job"><div class="jobdot"></div><div><div class="jobname">Weldflow</div><div class="jobmeta" id="weldMeta">0 hours this month</div></div><div class="jobmoney" id="weldPay">$0</div></div><div class="card job"><div class="jobdot"></div><div><div class="jobname">Security</div><div class="jobmeta" id="secMeta">0 hours this month</div></div><div class="jobmoney" id="secPay">$0</div></div></div><div class="sectionhead"><h2>Recent shifts</h2><button class="link" onclick="show('history')">See all</button></div><div class="recent" id="recent"></div><button class="fab" onclick="newEntry()">+</button></section>
<section id="calendar" class="screen"><div class="monthbar"><h2 id="calTitle"></h2><div class="arrows"><button class="arrow" onclick="moveMonth(-1)">‹</button><button class="arrow" onclick="moveMonth(1)">›</button></div></div><div class="calendar"><div class="weekdays"><div class="weekday">M</div><div class="weekday">T</div><div class="weekday">W</div><div class="weekday">T</div><div class="weekday">F</div><div class="weekday">S</div><div class="weekday">S</div></div><div class="days" id="days"></div></div><div class="detail card" id="dayDetail"></div></section>
<section id="add" class="screen"><div class="sectionhead"><h2 id="formTitle">Add work hours</h2></div><div class="formcard"><div class="seg"><button id="groupW" class="active" onclick="setGroup('Weldflow')">Weldflow</button><button id="groupS" onclick="setGroup('Security')">Security</button></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="grid2"><div class="field"><label>Start</label><input id="start" type="time"></div><div class="field"><label>End</label><input id="end" type="time"></div></div><div class="field"><label>Hourly rate (CAD)</label><input id="rate" type="number" min="0" step="0.01" inputmode="decimal" placeholder="22.00"></div><div class="field"><label>Notes (optional)</label><textarea id="notes" rows="3" placeholder="Anything you want to remember"></textarea></div><div class="calc"><span>Calculated</span><div><b id="calcHours">0h 0m</b><span id="calcPay" style="display:block;text-align:right">$0.00</span></div></div><button class="primary" onclick="saveEntry()" id="saveBtn">Save work hours</button><button class="secondary" style="width:100%;margin-top:8px;display:none" onclick="cancelEdit()" id="cancelBtn">Cancel edit</button></div></section>
<section id="history" class="screen"><div class="sectionhead"><h2>History</h2></div><div class="filters"><button class="filter active" onclick="setFilter('All')">All</button><button class="filter" onclick="setFilter('Weldflow')">Weldflow</button><button class="filter" onclick="setFilter('Security')">Security</button></div><div class="historylist" id="historyList"></div></section></div>
<nav class="nav"><div class="navinner"><button class="active" data-screen="overview" onclick="show('overview')"><span class="ico">⌂</span>Overview</button><button data-screen="calendar" onclick="show('calendar')"><span class="ico">▦</span>Calendar</button><button data-screen="add" onclick="newEntry()"><span class="ico">＋</span>Add</button><button data-screen="history" onclick="show('history')"><span class="ico">☰</span>History</button></div></nav>
<div class="modalback" id="more"><div class="sheet"><h3>More</h3><button onclick="exportData()">Export backup</button><button onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button onclick="closeMore()">Close</button><button class="danger" onclick="clearAll()">Delete all work records</button></div></div><div class="toast" id="toast"></div>
<script>
const KEY='workHours.v2';let entries=JSON.parse(localStorage.getItem(KEY)||'[]');let group='Weldflow',editing=null,filter='All',calDate=new Date();
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n||0);function pad(n){return String(n).padStart(2,'0')}function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function fmtDate(s,opts={month:'short',day:'numeric',year:'numeric'}){return new Intl.DateTimeFormat('en-CA',opts).format(new Date(s+'T12:00:00'))}function mins(a,b){if(!a||!b)return 0;let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number),x=ah*60+am,y=bh*60+bm;if(y<x)y+=1440;return y-x}function dur(m){return `${Math.floor(m/60)}h ${m%60}m`}function save(){localStorage.setItem(KEY,JSON.stringify(entries))}function monthMatch(e,d){let x=new Date(e.date+'T12:00:00');return x.getFullYear()==d.getFullYear()&&x.getMonth()==d.getMonth()}function totals(list){return list.reduce((a,e)=>{let m=mins(e.start,e.end);return {m:a.m+m,p:a.p+m/60*Number(e.rate||0)}},{m:0,p:0})}function weekStart(d){let x=new Date(d);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x}function inWeek(e,d){let x=new Date(e.date+'T12:00:00'),s=weekStart(d),en=new Date(s);en.setDate(en.getDate()+7);return x>=s&&x<en}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='overview')renderOverview();if(id==='calendar')renderCalendar();if(id==='history')renderHistory()}function newEntry(){editing=null;$('formTitle').textContent='Add work hours';$('saveBtn').textContent='Save work hours';$('cancelBtn').style.display='none';$('date').value=iso(new Date());$('start').value='';$('end').value='';$('rate').value=lastRate(group)||'';$('notes').value='';show('add');calc()}function setGroup(g){group=g;$('groupW').classList.toggle('active',g==='Weldflow');$('groupS').classList.toggle('active',g==='Security');if(!editing)$('rate').value=lastRate(g)||'';calc()}function lastRate(g){let e=[...entries].reverse().find(x=>x.group===g&&x.rate);return e?.rate||''}function calc(){let m=mins($('start').value,$('end').value),r=Number($('rate').value||0);$('calcHours').textContent=dur(m);$('calcPay').textContent=money(m/60*r)}['start','end','rate'].forEach(id=>$(id).addEventListener('input',calc));function saveEntry(){let date=$('date').value,start=$('start').value,end=$('end').value,rate=Number($('rate').value||0);if(!date||!start||!end||mins(start,end)<=0||rate<0){toast('Please enter a valid date, times and rate.');return}let item={id:editing||crypto.randomUUID(),group,date,start,end,rate,notes:$('notes').value.trim()};if(editing)entries=entries.map(e=>e.id===editing?item:e);else entries.push(item);save();toast(editing?'Shift updated':'Work hours saved');show('overview')}
function editEntry(id){let e=entries.find(x=>x.id===id);if(!e)return;editing=id;group=e.group;$('formTitle').textContent='Edit work hours';$('saveBtn').textContent='Update work hours';$('cancelBtn').style.display='block';$('date').value=e.date;$('start').value=e.start;$('end').value=e.end;$('rate').value=e.rate;$('notes').value=e.notes||'';setGroup(e.group);show('add');calc()}function cancelEdit(){newEntry()}function del(id){if(confirm('Delete this work record?')){entries=entries.filter(e=>e.id!==id);save();renderHistory();renderOverview();renderCalendar();toast('Record deleted')}}function setFilter(f){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.textContent===f));renderHistory()}
function renderOverview(){let now=new Date(),w=totals(entries.filter(e=>inWeek(e,now))),m=totals(entries.filter(e=>monthMatch(e,now)));$('overviewMonth').textContent=new Intl.DateTimeFormat('en-CA',{month:'long',year:'numeric'}).format(now);$('weekHours').textContent=dur(w.m);$('weekPay').textContent=money(w.p);$('monthHours').textContent=dur(m.m);$('monthPay').textContent=money(m.p);for(let g of ['Weldflow','Security']){let t=totals(entries.filter(e=>e.group===g&&monthMatch(e,now)));$(g==='Weldflow'?'weldMeta':'secMeta').textContent=`${dur(t.m)} this month`;$(g==='Weldflow'?'weldPay':'secPay').textContent=money(t.p)}let arr=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start)).slice(0,6);$('recent').innerHTML=arr.length?arr.map(e=>shiftHTML(e,false)).join(''):'<div class="card empty">No shifts yet. Tap + to add your first one.</div>'}
function shiftHTML(e,actions=true){let d=new Date(e.date+'T12:00:00');return `<div class="card shift"><div class="datebox"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-CA',{month:'short'}).toUpperCase()}</span></div><div class="shiftmain"><div class="shiftname">${e.group}</div><div class="shiftmeta">${fmtDate(e.date,{weekday:'short',month:'short',day:'numeric'})} · ${e.start}–${e.end}</div></div><div class="shiftmoney"><b>${money(mins(e.start,e.end)/60*e.rate)}</b><span>${dur(mins(e.start,e.end))}</span></div></div>`}
function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth();$('calTitle').textContent=new Intl.DateTimeFormat('en-CA',{month:'long',year:'numeric'}).format(calDate);let first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0),days=[];for(let i=0;i<offset;i++){let d=new Date(y,m,1-(offset-i));days.push(dayCell(d,true))}for(let i=1;i<=last.getDate();i++)days.push(dayCell(new Date(y,m,i),false));while(days.length<42){let d=new Date(y,m+1,days.length-offset-last.getDate()+1);days.push(dayCell(d,true))}$('days').innerHTML=days.join('');selectDay(iso(new Date(y,m,Math.min(new Date().getDate(),last.getDate()))))}function dayCell(d,muted){let s=iso(d),has=entries.some(e=>e.date===s),today=s===iso(new Date()),sel=s===window.selectedDay;return `<button class="day ${muted?'muted':''} ${today?'today':''} ${sel?'selected':''}" onclick="selectDay('${s}')">${d.getDate()}${has?'<span class="dot"></span>':''}</button>`}function selectDay(s){window.selectedDay=s;renderCalendarDaysOnly();let arr=entries.filter(e=>e.date===s);$('dayDetail').innerHTML=`<h3>${fmtDate(s,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h3>`+(arr.length?arr.map(e=>shiftHTML(e)).join('<div style="height:8px"></div>'):'<div class="empty">No work recorded for this date.</div>')}function renderCalendarDaysOnly(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0),days=[];for(let i=0;i<offset;i++)days.push(dayCell(new Date(y,m,1-(offset-i)),true));for(let i=1;i<=last.getDate();i++)days.push(dayCell(new Date(y,m,i),false));while(days.length<42){let d=new Date(y,m+1,days.length-offset-last.getDate()+1);days.push(dayCell(d,true))}$('days').innerHTML=days.join('')}function moveMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function renderHistory(){let arr=entries.filter(e=>filter==='All'||e.group===filter).sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));$('historyList').innerHTML=arr.length?arr.map(e=>`<div class="historyitem"><div class="historytop"><div><b>${e.group}</b><div class="shiftmeta">${fmtDate(e.date,{weekday:'short',month:'short',day:'numeric',year:'numeric'})} · ${e.start}–${e.end}</div></div><b>${money(mins(e.start,e.end)/60*e.rate)}</b></div><div class="shiftmeta" style="margin-top:7px">${dur(mins(e.start,e.end))} · ${money(e.rate)}/hr${e.notes?' · '+e.notes:''}</div><div class="historyactions"><button class="tiny" onclick="editEntry('${e.id}')">Edit</button><button class="tiny delete" onclick="del('${e.id}')">Delete</button></div></div>`).join(''):'<div class="card empty">No records found.</div>'}
function openMore(){$('more').classList.add('show')}function closeMore(){$('more').classList.remove('show')}function exportData(){let blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='work-hours-backup.json';a.click();URL.revokeObjectURL(url);closeMore();toast('Backup exported')}function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;entries=x;save();renderOverview();renderHistory();renderCalendar();toast('Backup imported')}catch{toast('That backup file is not valid.')}};r.readAsText(f);ev.target.value='';closeMore()}function clearAll(){if(confirm('Delete all work records? This cannot be undone unless you have an export backup.')){entries=[];save();renderOverview();renderHistory();renderCalendar();closeMore();toast('All records deleted')}}function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}window.addEventListener('load',()=>{window.selectedDay=iso(new Date());renderOverview();renderCalendar();renderHistory()});if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
